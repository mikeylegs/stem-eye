# Stem Eye -- XcodeGen spec (the Xcode project is generated from this on GitHub's Mac: `xcodegen generate`).
# Environment (set by .github/workflows/stem-eye.yml from the repository's variables / secrets):
#   BUNDLE_PREFIX  reverse-DNS prefix for the app ids        (default com.mikeylegs -> com.mikeylegs.stemeye + .Broadcast)
#   TEAM_ID        Apple Developer Team ID                    (only needed to sign)
#   BUILD_NUMBER   CFBundleVersion, must grow with every TestFlight upload (the workflow run number)
#   CONTROLLER     optional default Controller address baked into the build (the app's field overrides it)
name: StemEye
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    STEMEYE_CONTROLLER: "${CONTROLLER}"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  StemEye:
    type: application
    platform: iOS
    sources:
      - path: StemEye
      - path: Shared
    dependencies:
      - target: StemEyeBroadcast
        embed: true
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_NAME: StemEye
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.stemeye
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: StemEye/Info.plist
        CODE_SIGN_ENTITLEMENTS: StemEye/StemEye.entitlements
    info:
      path: StemEye/Info.plist
      properties:
        CFBundleDisplayName: Stem Eye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Stem Eye sends djay's screen to your lighting Controller on this Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        StemEyeController: $(STEMEYE_CONTROLLER)
    entitlements:
      path: StemEye/StemEye.entitlements
      properties:
        keychain-access-groups:
          - ${TEAM_ID}.${BUNDLE_PREFIX}.stemeye.shared
  StemEyeBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
    dependencies:
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_NAME: StemEyeBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.stemeye.Broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Stem Eye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        NSLocalNetworkUsageDescription: Stem Eye sends djay's screen to your lighting Controller on this Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        StemEyeController: $(STEMEYE_CONTROLLER)
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        keychain-access-groups:
          - ${TEAM_ID}.${BUNDLE_PREFIX}.stemeye.shared
schemes:
  StemEye:
    build:
      targets:
        StemEye: all
        StemEyeBroadcast: all
    run:
      config: Debug
    archive:
      config: Release
